[alembic]
# 迁移脚本目录
script_location = alembic
# 使 `alembic` 命令可 import app.*
prepend_sys_path = .
# 版本文件名：20261021_0001_init_schema.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# 迁移脚本时区（统一 UTC，与 utcnow() 一致）
timezone = UTC

# sqlalchemy.url 故意留空：由 alembic/env.py 从 app.core.config.Settings 注入，
# 避免密码等敏感信息进入版本库。

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
