# ============================================================================
# EvalAgent 前端 nginx 站点配置
# 能力：history 路由回退 / 静态资源缓存 / gzip 压缩 / 反向代理后端 /api
# 后端服务名 app 为 docker-compose.yml 中的服务名（compose 网络内解析）。
# ============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- gzip 压缩（JS/CSS/JSON/SVG 显著减小传输体积） ----------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2;

    # ---------- Vue Router history 模式：前端路由回退到 index.html ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 带内容哈希的静态资源：长缓存 ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- 反向代理后端 API（路径原样透传：/api/v1/** -> app:8000/api/v1/**） ----------
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;   # 透传请求ID，与后端 TraceID 链路打通
        # SSE 流式问答：关闭缓冲 + 拉长读超时，避免流式输出被截断
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 健康检查：nginx 自身探活
    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }
}
