name: tests

# 触发：推送到主分支、任何 PR、以及手动触发（便于面试演示时现场重跑）
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # 真实 Redis：仅限流集成测试（tests/test_rate_limit_enforcement.py）需要。
    # 不提供时那 7 例会 pytest.skip —— 结果为 544 passed / 7 skipped，
    # 提供后是全量 551 passed，徽章语义更干净。
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # 测试自带离线兜底（tests/conftest.py 用 setdefault 注入
      # DATABASE_URL=sqlite / REDIS_URL / SECRET_KEY / FAKE_REDIS），
      # 因此不需要 MySQL、不需要 .env 文件，也不需要任何 GitHub Secrets。
      - name: Run tests with coverage
        run: |
          pytest -q \
            --html=docs/test_reports/report.html --self-contained-html \
            --cov=app \
            --cov-report=term \
            --cov-report=xml \
            --cov-report=html:docs/test_reports/coverage \
            --cov-fail-under=80

      # 失败也要上传：排查时最需要的就是失败那一刻的堆栈与截图级详情
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            docs/test_reports/
            coverage.xml
          retention-days: 14
