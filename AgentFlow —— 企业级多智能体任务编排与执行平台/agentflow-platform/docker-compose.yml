# =============================================================================
# AgentFlow Platform —— 完整部署编排（v1.1）
#
# 一键拉起三个必需服务（各自独立定义、端口互不冲突）：
#   mysql      3307:3306   MySQL 8.0（utf8mb4，healthcheck 就绪后才起后端）
#   redis      6379:6379   Redis **Stack**（必须：checkpointer 依赖 RediSearch 索引，
#                          分层记忆依赖 RedisJSON；普通 redis:7 会降级为内存断点）
#   backend    8000:8000   FastAPI + LangGraph（多阶段镜像，非 root，alembic 先迁移）
#
# 两个可选服务（默认不启动，按需 --profile）：
#   frontend   8080:80     Nginx 托管 agentflow-web/dist，并把 /api 反代到 backend
#   project1   8010:8000   项目一「企业垂直知识库 Agent 后台」（kb-search 真实数据源）
#
# 常用命令：
#   cp .env.example .env && docker compose up -d --build        # 三服务一键 up
#   docker compose --profile frontend up -d                     # 额外起前端（需先 npm run build）
#   docker compose --profile project1 up -d                     # 额外起项目一（真实检索）
#   docker compose logs -f backend                              # 跟踪后端日志
#   docker compose down                                         # 停止（保留数据卷）
#   docker compose down -v                                      # 连数据一起清
#
# 端口与宿主冲突说明：
#   - MySQL 用 3307 而不是 3306：避免与系统自带的 MySQL80 服务（开机自启）抢端口；
#   - Redis 用默认 6379：与本机 redis-stack 容器二选一，别同时起；
#   - 项目一容器内部仍是 8000，宿主改 8010，与 .env 的 EXTERNAL_RAG_BASE_URL 对齐。
# =============================================================================

name: agentflow-platform

# ---------------------------------------------------------------------------
# 公共环境变量（三个必需服务的共享项，避免重复书写）
# ---------------------------------------------------------------------------
x-common-env: &common-env
  APP_ENV: ${APP_ENV:-local}
  DEBUG: ${DEBUG:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_JSON: ${LOG_JSON:-true}
  SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me-0123456789abcdef}

services:
  # =========================================================================
  # 1) MySQL：业务库（任务 / 子任务 / 审批 / 轨迹 / 记忆 8 张表）
  # =========================================================================
  mysql:
    image: mysql:8.0
    container_name: agentflow-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pwd}
      MYSQL_DATABASE: ${MYSQL_DB:-agentflow}
      MYSQL_USER: ${MYSQL_USER:-agentflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agentflow_pwd}
      TZ: Asia/Shanghai
    ports:
      # 宿主 3307 → 容器 3306（避开系统 MySQL80 的 3306）
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  # =========================================================================
  # 2) Redis Stack：事件流 / 断点 / 令牌黑名单 / 限流 / 短期记忆
  #    必须是 redis-stack（含 RediSearch + RedisJSON），否则 AsyncRedisSaver
  #    无法建索引，checkpointer 会降级 InMemorySaver（重启丢审批断点）。
  # =========================================================================
  redis:
    image: redis/redis-stack-server:latest
    container_name: agentflow-redis
    command:
      - redis-stack-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      # 同时验存活 + 模块（search 缺失时 checkpointer 会静默降级，必须显式拦住）
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG && redis-cli MODULE LIST | grep -qi search"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  # =========================================================================
  # 3) AgentFlow 后端：API + SSE + 编排（容器内 8000）
  # =========================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentflow-backend
    environment:
      <<: *common-env
      # ---- 容器内一律走服务名，覆盖 .env 里的 127.0.0.1 ----
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-agentflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agentflow_pwd}
      MYSQL_DB: ${MYSQL_DB:-agentflow}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-agentflow}
      # ---- 鉴权 ----
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-120}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # ---- 外部依赖开关（mock=true 时知识库走内置周报语料，无需项目一）----
      MOCK_EXTERNAL_RAG: ${MOCK_EXTERNAL_RAG:-true}
      MOCK_EXTERNAL_EVAL: ${MOCK_EXTERNAL_EVAL:-true}
      EXTERNAL_RAG_CONTRACT: ${EXTERNAL_RAG_CONTRACT:-project1_kb_query}
      # 真实检索时指向项目一容器（compose 网络内部端口 8000）
      EXTERNAL_RAG_BASE_URL: ${EXTERNAL_RAG_BASE_URL:-http://project1:8000}
      EXTERNAL_RAG_KB_ID: ${EXTERNAL_RAG_KB_ID:-6}
      EXTERNAL_RAG_USERNAME: ${EXTERNAL_RAG_USERNAME:-}
      EXTERNAL_RAG_PASSWORD: ${EXTERNAL_RAG_PASSWORD:-}
      # ---- LLM ----
      LLM_MOCK: ${LLM_MOCK:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      # ---- 运行形态 ----
      CHECKPOINTER_BACKEND: ${CHECKPOINTER_BACKEND:-redis}
      STREAM_BACKEND: ${STREAM_BACKEND:-redis}
      ENABLE_LAYERED_MEMORY: ${ENABLE_LAYERED_MEMORY:-true}
      SSE_ENABLED: ${SSE_ENABLED:-true}
      SSE_IDLE_TIMEOUT_SECONDS: ${SSE_IDLE_TIMEOUT_SECONDS:-300}
      # ---- v1.1：限流（容器内默认开，配额可按需覆盖）----
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-300}
      RATE_LIMIT_LLM_PER_MINUTE: ${RATE_LIMIT_LLM_PER_MINUTE:-30}
      RATE_LIMIT_KB_PER_MINUTE: ${RATE_LIMIT_KB_PER_MINUTE:-60}
      # ---- v1.1：评审人工批注闸门 ----
      REVIEW_HUMAN_INTERVENTION_ENABLED: ${REVIEW_HUMAN_INTERVENTION_ENABLED:-true}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # 图表产物 / 上传文件落盘（容器重建不丢）
      - backend_storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 先迁移再起服务：冷启动幂等（无新迁移时 upgrade head 为空操作）
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.bootstrap:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # =========================================================================
  # 4) [可选] 前端：Nginx 托管构建产物 + 反代 /api 与 SSE
  #    启动前先构建：cd ../agentflow-web && npm ci && npm run build
  #    docker compose --profile frontend up -d
  # =========================================================================
  frontend:
    image: nginx:1.27-alpine
    container_name: agentflow-frontend
    profiles: ["frontend"]
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      - ../agentflow-web/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # =========================================================================
  # 5) [可选] 项目一「企业垂直知识库 Agent 后台」：kb-search 的真实数据源
  #    docker compose --profile project1 up -d
  #    注意：项目一自带 Dockerfile，**本项目不修改它任何代码**；这里只注入容器内连接串。
  #    它的库与 AgentFlow 的库分开（默认 kb_agent），首次启动需先建库。
  # =========================================================================
  project1:
    build:
      context: ${PROJECT_ONE_DIR:-../企业垂直知识库 Agent 后台}
      dockerfile: Dockerfile
    container_name: agentflow-project1
    profiles: ["project1"]
    environment:
      APP_ENV: ${PROJECT1_APP_ENV:-dev}
      # 项目一用独立库，与 agentflow 隔离（同一 MySQL 实例、不同 schema）
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-agentflow}:${MYSQL_PASSWORD:-agentflow_pwd}@mysql:3306/${PROJECT1_DB:-kb_agent}?charset=utf8mb4
      REDIS_URL: redis://redis:6379/1
      FAKE_REDIS: "false"
      SECRET_KEY: ${PROJECT1_SECRET_KEY:-change-me-project-one-secret-0123456789}
      AUTO_CREATE_TABLES: "true"
      CORS_ORIGINS: "*"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      # 宿主 8010 → 容器 8000（与 .env 的 EXTERNAL_RAG_BASE_URL 对齐）
      - "${PROJECT1_PORT:-8010}:8000"
    volumes:
      - project1_chroma:/app/chroma_db
      - project1_uploads:/app/uploads
      - project1_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
    name: agentflow_mysql_data
  redis_data:
    name: agentflow_redis_data
  backend_storage:
    name: agentflow_backend_storage
  project1_chroma:
    name: agentflow_project1_chroma
  project1_uploads:
    name: agentflow_project1_uploads
  project1_data:
    name: agentflow_project1_data
