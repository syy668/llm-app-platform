# AgentFlow 前端容器（nginx:1.27-alpine）配置 —— 配合 docker-compose.yml 的 frontend profile
#
# 两件事：
#   1. 托管 agentflow-web/dist（Vue 前端，hash 路由，无需 history fallback 也不怕刷新）；
#   2. 把 /api 与健康检查反代到 backend 容器，并**关闭代理缓冲**——SSE 必须边收边发，
#      否则浏览器会等到连接结束才收到事件（表现为"进度条一直不动，最后一次性刷出来"）。

upstream agentflow_backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端构建产物带 hash，可长缓存；index.html 必须不缓存，否则升级后拿到旧入口
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- API 反代（含 SSE）----
    location /api/ {
        proxy_pass http://agentflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE 关键三项：不缓冲、不压缩、长超时
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # ---- 健康检查（compose healthcheck / 运维探针）----
    location = /healthz {
        proxy_pass http://agentflow_backend/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- 图表产物（后端 /static/charts 落盘目录）----
    location /static/ {
        proxy_pass http://agentflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1h;
    }
}
